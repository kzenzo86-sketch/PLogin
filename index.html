<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Tela de Login</title>
  
  <style>
    body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg, 
                #007af3 0%, 
                #e908e9 100% 
            );
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden; 
            position: relative;
            text-align: center;
        }
        .login-forma {
            padding: 20px 30px;
        }
        .input-grupo {
            position: relative;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .header {
            background-color: #5E35B1; 
            height: 150px;
            position: relative;
            margin-bottom: 50px;
        }
        .circulo-avatar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #fff;
            padding: 5px;
            box-shadow: 0 0 0 5px #5E35B1;
        }
       
        
        .circulo-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            object-fit: cover;
        }
        .forgot-password {
            text-decoration: none;
            color: #5E35B1; 
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0; 
            margin-left: 10px;
        }

  </style>
</head>
<body>
  <div class="login-container">
        <div class="header">
            <div class="circulo-avatar">
                <img src="avatar.jpg" alt="Avatar Usuária">
            </div>
        </div>
        <form class="login-forma">
            <div class="input-grupo">
                <input type="text" placeholder="Nome de usuario">
            </div>

            <div class="input-grupo">
                
                <input type="password" placeholder="Senha">
                <a href="#" class="forgot-password">Esqueceu a Senha ?</a>
            </div>

            <button type="submit" class="sign-in-btn">Entrar</button>
        </form>

        <p class="register-text">
            Não Tem uma conta ? <a href="#" class="register-link">Registre-se</Registre-se></a>
        </p>
    </div>
</body>
